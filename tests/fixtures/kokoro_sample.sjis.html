<h3 class="o-midashi"><a class="midashi_anchor" id="midashi10">上　先生と私</a></h3>
<br />
<h4 class="naka-midashi"><a class="midashi_anchor" id="midashi20">一</a></h4>
<br />
　<ruby><rb>私</rb><rp>（</rp><rt>わたくし</rt><rp>）</rp></ruby>はその人を常に先生と呼んでいた。だからここでもただ先生と書くだけで本名は打ち明けない。<br />
　私が先生と知り合いになったのは<ruby><rb>鎌倉</rb><rp>（</rp><rt>かまくら</rt><rp>）</rp></ruby>である。<span class="notes">［＃「鎌倉」に傍点］</span><em class="sesame_dot">その時</em>私はまだ若々しい書生であった。<br />
<br />
　外字の例<img src="../../../gaiji/1-84/1-84-77.png" alt="※(「てへん＋劣」、第3水準1-84-77)" class="gaiji" />です。<br />
<div class="jisage_2" style="margin-left: 2em">字下げされた行。<br />
