name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run catalog
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # 図書カードの解説の取得を数件だけ試す（形式の変化に気づくため）
      - run: npm run notes
        env:
          NOTES_PREVIOUS: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/card-notes.json
          NOTES_MAX: 5
      - run: npm run build
