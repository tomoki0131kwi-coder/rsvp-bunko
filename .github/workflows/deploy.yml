name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 毎日 4:17（日本時間）に、図書目録（青空文庫の作品一覧）を作り直し、
  # 図書カードの解説を未取得の分だけ取り込む（初回は数日に分けて全件を取る）
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # 青空文庫の作品一覧 CSV と本文ミラーのファイル一覧から public/catalog.json を作る
      - run: npm run catalog
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # 図書カードの「作品について」「人物について」。前回公開した分を引き継ぎ、未取得の図書カードだけを
      # 1 秒に 1 件、最大 40 分取得する
      - run: npm run notes
        env:
          NOTES_PREVIOUS: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/card-notes.json
          NOTES_BUDGET_SECONDS: 2400
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
