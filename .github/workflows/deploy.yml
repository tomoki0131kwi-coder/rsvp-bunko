name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 図書目録（青空文庫の作品一覧）を新しくするため、毎週月曜 4:17（日本時間）に作り直す
  schedule:
    - cron: '17 19 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # 青空文庫の作品一覧 CSV と本文ミラーのファイル一覧から public/catalog.json を作る
      - run: npm run catalog
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
